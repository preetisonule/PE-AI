<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TherapyBot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="chat-container">
        <h2>🪷 TherapyBot</h2>
        <div class="chat-box" id="chat-box"></div>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Type how you feel..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("user-input");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if (!msg) return;

            chatBox.innerHTML += `<div class='user-msg'>${msg}</div>`;
            input.value = "";

            // Show typing animation
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('bot-msg');
            typingDiv.innerHTML = `<em>TherapyBot is typing...</em>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch("/get", {
                method: "POST",
                body: new URLSearchParams({ msg }),
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
            });

            const data = await response.json();

            setTimeout(() => {
                typingDiv.remove();
                chatBox.innerHTML += `<div class='bot-msg'>${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 700); // adds slight delay for realism
        });
    </script>

</body>

</html>
